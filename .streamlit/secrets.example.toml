# 예시입니다. 실제 값은 GitHub가 아니라 Streamlit 앱의 Settings > Secrets에 등록합니다.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE-WITH-A-LONG-RANDOM-SECRET-AT-LEAST-32-CHARACTERS"

[auth.google]
client_id = "YOUR-GOOGLE-WEB-CLIENT-ID.apps.googleusercontent.com"
client_secret = "REPLACE-IN-STREAMLIT-SECRETS-ONLY"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid email", prompt = "select_account" }

[storage]
# 현재 연결 대상으로 확인한 Supabase의 ggsafe 프로젝트를 쓸 때는 기존 DB 비밀번호만 등록한다.
# Supabase 계정 로그인 비밀번호나 SUPABASE_ACCESS_TOKEN가 아니다.
database_password = "REPLACE-WITH-EXISTING-GGSAFE-DATABASE-PASSWORD"
# 다른 PostgreSQL 연결 주소를 이미 쓰는 경우 위 항목 대신 database_url만 등록한다.
# database_url = "postgresql://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"
