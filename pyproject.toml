[project]
name = "ggsafe-streamlit"
version = "1.0.0"
description = "Google 계정별 이메일·비밀번호 유출 검사 도우미"
requires-python = ">=3.11,<3.15"
dependencies = [
  "streamlit[auth]>=1.67.0,<1.68",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary]>=3.3.9,<3.4",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<9.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests_streamlit"]
pythonpath = ["."]
addopts = "-q"
